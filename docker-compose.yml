version: '3.8'

services:
  deeplake-service:
    build: .
    ports:
      - "8000:8000"    # HTTP
      - "50051:50051"  # gRPC (DeepLake)
    environment:
      # Deep Lake Configuration
      - DEEPLAKE_STORAGE_LOCATION=/app/data/vectors
      - DEEPLAKE_TOKEN=${DEEPLAKE_TOKEN:-}
      - DEEPLAKE_ORG_ID=${DEEPLAKE_ORG_ID:-}

      # HTTP Server Configuration  
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=8000
      - HTTP_WORKERS=1

      # gRPC Server Configuration
      - GRPC_HOST=0.0.0.0
      - GRPC_PORT=50051
      - GRPC_MAX_WORKERS=10

      # Authentication (REQUIRED)
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRATION_HOURS=24

      # Redis Configuration
      - REDIS_URL=redis://redis-shared:6379/0
      - REDIS_TTL_SECONDS=3600

      # Monitoring
      - MONITORING_ENABLE_METRICS=true
      - MONITORING_METRICS_PORT=9091
      - MONITORING_LOG_LEVEL=INFO
      - MONITORING_LOG_FORMAT=json

      # Performance
      - PERFORMANCE_MAX_VECTOR_BATCH_SIZE=1000
      - PERFORMANCE_DEFAULT_SEARCH_TIMEOUT=30
      - PERFORMANCE_MAX_CONCURRENT_SEARCHES=50

      # Development
      - DEV_DEBUG=false
      - DEV_RELOAD=false
      - DEV_CORS_ORIGINS=["http://localhost:3000", "http://localhost:8080"]
      - DEV_DEFAULT_API_KEY=${DEV_DEFAULT_API_KEY:-}
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    depends_on: []
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - tas-shared-network



networks:
  tas-shared-network:
    external: true