# Maps code paths to the documents that describe them.
# Read by .claude/skills/doc-factory/scripts/detect_stale_docs.py.
#
# READMEs watch broadly on purpose: a README's status section goes stale
# without any commit touching the README itself.

documents:
  - path: README.md
    doc_type: readme
    owner: "@jscharber"
    watches:
      - "app/__init__.py"
      - "app/api"
      - "app/config"
      - "app/main.py"
      - "app/middleware"
      - "app/models"
      - "app/services"
      - "app/utils"
      - "pyproject.toml"
